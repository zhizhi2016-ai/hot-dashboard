name: Daily Update

on:
  schedule:
    - cron: '0 0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest hot.html
        run: |
          curl -sL -o index.html "https://ad5cc899921aa2028.bj7.agentos-app.net/hot.html"
          SIZE=$(wc -c < index.html)
          SECS=$(grep -c card-title index.html || echo 0)
          echo "Size: $SIZE bytes"
          echo "Sections: $SECS"
          [ "$SIZE" -lt 100000 ] && { echo "File too small, skip"; exit 0; }
          [ "$SECS" -lt 7 ] && { echo "Need 7 sections, got $SECS"; exit 0; }

      - name: Commit and push
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet && { echo "No changes"; exit 0; }
          git commit -m "Auto update $(date +%Y.%m.%d)"
          git push
          echo "Updated GitHub Pages"