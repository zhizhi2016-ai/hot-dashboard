name: Daily Update

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Download latest hot.html
        run: |
          curl -sL -o index.html "https://ad5cc899921aa2028.bj7.agentos-app.net/hot.html?t=$(date +%s)"
          SIZE=$(wc -c < index.html)
          SECS=$(grep -c 'card-title' index.html || echo 0)
          echo "Size: $SIZE bytes, Sections: $SECS"
          if [ "$SIZE" -lt 100000 ]; then
            echo "File too small, abort"
            exit 0
          fi
          if [ "$SECS" -lt 7 ]; then
            echo "Need 7 sections, abort"
            exit 0
          fi
          echo "ok=true" >> $GITHUB_ENV

      - name: Update GitHub Pages via API
        if: env.ok == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import base64, json, os, urllib.request, datetime

          token = os.environ['GITHUB_TOKEN']
          owner, repo = 'zhizhi2016-ai', 'hot-dashboard'
          api_url = f'https://api.github.com/repos/{owner}/{repo}/contents/index.html?ref=main'

          print('Step 1: 获取当前 index.html 的 SHA...')
          req = urllib.request.Request(api_url, headers={
            'Authorization': f'token {token}',
            'Accept': 'application/vnd.github.v3+json'
          })
          try:
            with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read().decode('utf-8'))
              sha = data['sha']
              print(f'  SHA: {sha}')
          except Exception as e:
            print(f'  获取 SHA 失败: {e}')
            raise

          print('Step 2: 读取并编码 index.html...')
          with open('index.html', 'rb') as f:
            content = base64.b64encode(f.read()).decode('utf-8')
          print(f'  文件大小: {len(content)} bytes (base64)')

          print('Step 3: 调用 GitHub API 更新文件...')
          msg = datetime.datetime.now().strftime('Auto update %Y.%m.%d')
          payload = json.dumps({
            'message': msg,
            'content': content,
            'sha': sha,
            'branch': 'main'
          }, ensure_ascii=False).encode('utf-8')

          req = urllib.request.Request(api_url, data=payload, method='PUT', headers={
            'Authorization': f'token {token}',
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          })
          try:
            with urllib.request.urlopen(req) as resp:
              result = json.loads(resp.read().decode('utf-8'))
              print(f'  更新成功: {result["commit"]["html_url"]}')
          except urllib.error.HTTPError as e:
            print(f'  更新失败 HTTP {e.code}: {e.read().decode("utf-8")}')
            raise

          print('Done')
          PY
