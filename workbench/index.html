<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="智智"/>
<meta name="theme-color" content="#29b6f6"/>
<meta name="description" content="智智的幼儿早教工作台 - 认物认知、语言表达、数理思维、英语启蒙、生活常识等多领域学习"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png"/>
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png"/>

<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"/>
<title>智智 - 幼儿早教工作台</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#f0f7ff}
#app{height:100%;display:flex;flex-direction:column;max-width:768px;margin:0 auto;background:#fff;position:relative}

/* 横屏适配：侧边栏 + 主内容左右布局 */
@media (orientation: landscape) and (max-height: 500px) {
  #app{max-width:100%;flex-direction:row}
  .topbar{position:absolute;top:0;left:0;right:0;z-index:1000}
  .brandbar{display:none}
  .main{flex:1;display:flex;flex-direction:row;margin-top:52px;height:calc(100% - 52px)}
  .sidebar{width:120px;flex-direction:column;height:100%;overflow-y:auto;padding-top:8px}
  .menu-item{flex-direction:column;align-items:center;padding:8px 4px}
  .menu-ic{font-size:22px;margin-right:0;margin-bottom:2px}
  .menu-tx{font-size:11px}
  .content{flex:1;height:100%;overflow-y:auto}
  .tabs{position:sticky;top:0;z-index:100;background:#fff;padding-top:8px}
}

/* 顶部栏 */
.topbar{background:linear-gradient(180deg,#4fc3f7,#29b6f6);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);z-index:100}
.top-home{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;background:rgba(255,255,255,.2)}
.top-url{flex:1;background:rgba(255,255,255,.25);border-radius:18px;padding:6px 12px;font-size:13px;display:flex;align-items:center;gap:6px;color:#fff;backdrop-filter:blur(4px)}
.top-icons{display:flex;align-items:center;gap:12px}
.top-icon{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:700;cursor:pointer;position:relative}
.top-icon.star{color:#FFD700;text-shadow:0 0 3px rgba(0,0,0,.2)}
.sync-dot{position:absolute;top:-4px;right:-4px;width:8px;height:8px;background:#ff5252;border-radius:50%;border:2px solid #4fc3f7}

/* 品牌标题 */
.brandbar{background:#f8fbff;padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #e3f2fd}
.brand-ic{font-size:28px}
.brand-name{font-size:20px;font-weight:800;color:#333}
.brand-tag{margin-left:auto;font-size:12px;color:#666;background:#e3f2fd;padding:4px 10px;border-radius:12px}

/* 主体布局 */
.main{flex:1;display:flex;overflow:hidden}
.sidebar{width:76px;background:linear-gradient(180deg,#e1f5fe,#f0f7ff);overflow-y:auto;overflow-x:hidden;border-right:1px solid #e3f2fd;padding:8px 0;display:flex;flex-direction:column;gap:6px}
.menu-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;cursor:pointer;border-radius:12px;margin:0 6px;transition:all .2s;position:relative}
.menu-item:active{transform:scale(.92);background:#b3e5fc!important}
.menu-item.active{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.menu-item.active{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.menu-item.active::before{content:'';position:absolute;left:-6px;top:50%;transform:translateY(-50%);width:4px;height:24px;background:#29b6f6;border-radius:0 4px 4px 0}
.menu-ic{font-size:24px}
.menu-tx{font-size:10px;font-weight:700;color:#555;text-align:center;line-height:1.2;max-width:100%}
.menu-item.active .menu-tx{color:#0288d1}

.content{flex:1;overflow-y:auto;overflow-x:hidden;background:#f8fbff;padding:12px;position:relative}

/* 通用卡片 */
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 12px rgba(0,0,0,.05);margin-bottom:12px}
.card-hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-icon{font-size:24px}
.card-title{font-size:18px;font-weight:800;color:#333;flex:1}
.card-tag{font-size:11px;color:#666;background:#f0f4f8;padding:3px 8px;border-radius:10px}

/* 子标签 */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{background:#fff;border:1px solid #e0e0e0;border-radius:20px;padding:8px 14px;font-size:13px;font-weight:700;color:#666;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .2s}
.tab:active{transform:scale(.95)}
.tab.active{background:#29b6f6;color:#fff;border-color:#29b6f6}

/* 顶部进度 */
.prog-hd{display:flex;justify-content:flex-start;align-items:center;gap:6px;margin-bottom:10px;font-size:14px;color:#666}
.prog-hd b{color:#29b6f6}

/* 物品卡片 */
.item-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item-card{background:#fff;border:1px solid #e8f0f8;border-radius:16px;padding:12px;text-align:center;position:relative}
.item-emoji{font-size:48px;margin-bottom:6px;display:flex;align-items:center;justify-content:center;min-height:52px}
.item-emoji svg{width:48px;height:48px}
.item-name{font-size:17px;font-weight:800;color:#333}
.item-pinyin{font-size:13px;color:#888;margin-top:2px}
.item-desc{font-size:12px;color:#999;margin-top:4px}
.sound-btn{width:32px;height:32px;border-radius:50%;border:2px solid #29b6f6;background:#fff;color:#29b6f6;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;margin:8px auto 0;transition:all .2s}
.sound-btn:active{transform:scale(.9);background:#29b6f6;color:#fff}

/* 古诗卡片 */
.poem-card{background:linear-gradient(180deg,#fff,#f8fbff);border:1px dashed #b3e5fc;border-radius:18px;padding:16px;margin-bottom:12px;text-align:center}
.poem-title{font-size:20px;font-weight:800;color:#333}
.poem-author{font-size:13px;color:#888;margin:4px 0 12px}
.poem-lines{font-size:18px;line-height:2;color:#444;font-weight:500}
.poem-mean{font-size:13px;color:#666;background:#fff3e0;border-radius:10px;padding:10px;margin:12px 0;text-align:left;line-height:1.6}
.poem-btns{display:flex;gap:10px;justify-content:center}
.btn-primary{background:#29b6f6;color:#fff;border:none;border-radius:20px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;transition:transform .1s}
.btn-primary:active{transform:scale(.95)}
.btn-gold{background:#ffc107;color:#333;border:none;border-radius:20px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;transition:transform .1s}
.btn-gold:active{transform:scale(.95)}
.btn-gold:disabled{background:#e0e0e0;color:#999}

/* 数理思维点数 */
.count-item{background:#e8f5e9;border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.count-num{font-size:40px;font-weight:800;color:#2e7d32;width:50px;text-align:center}
.count-emoji{font-size:32px}
.count-text{flex:1;font-size:15px;font-weight:700;color:#333}

/* 英语卡片 */
.en-card{background:#fff;border:1px solid #e8f0f8;border-radius:16px;padding:12px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.en-emoji{font-size:42px}
.en-info{flex:1}
.en-word{font-size:22px;font-weight:800;color:#1565c0}
.en-cn{font-size:14px;color:#666}
.en-sound{width:36px;height:36px;border-radius:50%;border:2px solid #29b6f6;background:#fff;color:#29b6f6;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all .2s}
.en-sound:active{transform:scale(.9);background:#29b6f6;color:#fff}

/* 字母卡片 */
.letter-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.letter-card{background:#fff;border:1px solid #e8f0f8;border-radius:18px;padding:14px;text-align:center}
.letter-big{font-size:42px;font-weight:800;color:#1565c0}
.letter-word{font-size:16px;font-weight:700;color:#333}
.letter-cn{font-size:12px;color:#888}
.letter-emoji{font-size:36px;margin:6px 0}
.letter-btns{display:flex;gap:8px;justify-content:center;margin-top:8px}
.letter-btn{width:36px;height:36px;border-radius:50%;border:2px solid #29b6f6;background:#fff;color:#29b6f6;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer}
.letter-btn.done{background:#29b6f6;color:#fff}

/* 数字卡片 */
.num-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.num-card{background:#fff;border:1px solid #e8f0f8;border-radius:14px;padding:10px 4px;text-align:center;position:relative;cursor:pointer;transition:transform .1s}
.num-card:active{transform:scale(.95)}
.num-card.done{background:#e8f5e9;border-color:#4caf50}
.num-num{font-size:22px;font-weight:800;color:#333}
.num-num.done{color:#2e7d32}
.num-emoji{font-size:22px;margin-top:2px}
.num-check{position:absolute;top:2px;right:2px;font-size:12px;color:#4caf50;display:none}
.num-card.done .num-check{display:block}

/* 儿歌 */
.song-item{background:#fce4ec;border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.song-info{flex:1}
.song-name{font-size:16px;font-weight:800;color:#880e4f}
.song-desc{font-size:12px;color:#9e9e9e;margin-top:2px}
.song-play{width:42px;height:42px;border-radius:50%;background:#ff9800;color:#fff;border:none;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.song-play:active{transform:scale(.9)}

/* 美术方格 */
.art-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.art-item{background:#fff;border:1px solid #e8f0f8;border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;transition:all .2s}
.art-item:active{transform:scale(.95)}
.art-emoji{font-size:28px;margin-bottom:4px}
.art-name{font-size:12px;font-weight:700;color:#333;line-height:1.3}

/* 生活常识 */
.life-item{background:#fff;border:1px solid #e8f0f8;border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.life-ic{font-size:32px;width:42px;text-align:center}
.life-info{flex:1}
.life-title{font-size:15px;font-weight:800;color:#333}
.life-desc{font-size:12px;color:#888;margin-top:2px}
.life-check{width:32px;height:32px;border-radius:50%;border:2px solid #bdbdbd;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;transition:all .2s}
.life-check.done{background:#4caf50;border-color:#4caf50}

/* 打卡 */
.check-row{background:#fff;border:1px solid #e8f0f8;border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.check-ic{font-size:28px}
.check-info{flex:1}
.check-name{font-size:15px;font-weight:800;color:#333}
.check-prog{font-size:13px;color:#888;margin-top:3px}
.check-status{font-size:13px;font-weight:700;color:#29b6f6;white-space:nowrap}
.check-status.done{color:#4caf50}
.check-btn{background:#ffc107;color:#333;border:none;border-radius:16px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;transition:transform .1s;white-space:nowrap}
.check-btn:active{transform:scale(.95)}
.check-btn.done{background:#e0e0e0;color:#999}

/* 日历 */
.cal-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-nav{background:#fff;border:1px solid #e0e0e0;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
.cal-title{font-size:16px;font-weight:800}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border-radius:10px;background:#fff;color:#333}
.cal-day.hd{color:#999;background:transparent}
.cal-day.today{background:#29b6f6;color:#fff}
.cal-day.checked{background:#e8f5e9;color:#2e7d32;border:2px solid #4caf50}

/* 奖励兑换 */
.shop-item{background:#fffde7;border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.shop-name{flex:1;font-size:15px;font-weight:800;color:#333;display:flex;align-items:center;gap:8px}
.shop-ic{font-size:26px}
.shop-price{font-size:14px;font-weight:700;color:#ff9800;white-space:nowrap}
.shop-btn{background:#ffc107;color:#333;border:none;border-radius:16px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:transform .1s}
.shop-btn:active{transform:scale(.95)}
.shop-btn:disabled{background:#e0e0e0;color:#999}

/* 统计 */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:linear-gradient(180deg,#fff,#f0f7ff);border:1px solid #e3f2fd;border-radius:16px;padding:14px;text-align:center}
.stat-num{font-size:28px;font-weight:800;color:#29b6f6}
.stat-label{font-size:12px;color:#666;margin-top:4px}
.progress-item{margin-bottom:12px}
.progress-hd{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.progress-bar{height:10px;background:#e0e0e0;border-radius:5px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#29b6f6,#4fc3f7);border-radius:5px;transition:width .3s}

/* 运动卡片 */
.sport-card{background:#fff;border-radius:18px;overflow:hidden;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.06);border:1px solid #e8f0f8}
.sport-top{display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;transition:background .2s}
.sport-top:active{background:#f0f7ff}
.sport-emoji{font-size:42px;min-width:52px;text-align:center}
.sport-info{flex:1}
.sport-name{font-size:17px;font-weight:800;color:#333}
.sport-tag{font-size:12px;color:#666;margin-top:2px}
.sport-star{color:#FFD700;font-size:16px;font-weight:800}
.sport-expand{width:100%;overflow:hidden;max-height:0;transition:max-height .35s ease}
.sport-expand.open{max-height:600px}
.sport-body{padding:0 14px 14px}
.sport-step{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:14px;color:#444;line-height:1.7}
.sport-step-num{width:22px;height:22px;border-radius:50%;background:#29b6f6;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.sport-actions{display:flex;gap:8px;margin-top:10px}
.sport-btn{flex:1;border:none;border-radius:18px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;transition:transform .1s;display:flex;align-items:center;justify-content:center;gap:4px}
.sport-btn:active{transform:scale(.95)}
.sport-btn-play{background:#e3f2fd;color:#1565c0}
.sport-btn-done{background:#ffc107;color:#333}
.sport-btn-done.done{background:#e0e0e0;color:#999}
.sport-timer{background:#fff3e0;border-radius:12px;padding:10px;text-align:center;margin-bottom:10px;font-size:14px;color:#e65100;font-weight:700}
.sport-timer .big{font-size:36px;display:block}

/* Toast */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%)scale(.9);background:rgba(0,0,0,.78);color:#fff;padding:14px 24px;border-radius:18px;font-size:14px;font-weight:700;z-index:1000;opacity:0;pointer-events:none;transition:all .25s;text-align:center;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,-50%)scale(1)}

/* 动画 */
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.pop-anim{animation:pop .3s}

/* 植物大战僵尸游戏 - 塔防 */
/* 植物大战僵尸 - 学习答题游戏 */
.game-scene{background:linear-gradient(180deg,#a5d6a7,#81c784);border-radius:20px;padding:20px 16px;position:relative;overflow:hidden;min-height:300px}
.game-lawn{background:linear-gradient(180deg,#8bc34a 0%,#689f38 50%,#558b2f 100%);border-radius:14px;padding:16px;position:relative;min-height:120px;margin-bottom:12px}
.game-path{height:60px;background:rgba(0,0,0,.1);border-radius:30px;position:relative;overflow:hidden;margin:8px 0}
.game-zombie-move{position:absolute;top:50%;transform:translateY(-50%);font-size:40px;transition:left .6s ease;z-index:3;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
.game-zombie-move.hit{animation:zombieShake .3s ease}
.game-zombie-move.defeat{animation:zombieDefeat .6s ease forwards}
@keyframes zombieShake{0%,100%{transform:translateY(-50%)}25%{transform:translateY(-60%) rotate(-10deg)}75%{transform:translateY(-40%) rotate(10deg)}}
@keyframes zombieDefeat{0%{opacity:1;transform:translateY(-50%) scale(1)}100%{opacity:0;transform:translateY(-90%) scale(.3)}}
.game-plant-def{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:36px;z-index:4;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.game-plant-def.shoot{animation:plantShoot .3s ease}
@keyframes plantShoot{0%,100%{transform:translateY(-50%)}50%{transform:translateY(-60%) scale(1.1)}}
.game-question{background:rgba(255,255,255,.95);border-radius:16px;padding:14px 16px;text-align:center;margin-bottom:10px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.game-question .q-emoji{font-size:48px;display:block;margin-bottom:4px}
.game-question .q-text{font-size:18px;font-weight:800;color:#333}
.game-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.game-option{background:#fff;border:2px solid #e0e0e0;border-radius:14px;padding:12px;font-size:18px;font-weight:700;color:#333;cursor:pointer;text-align:center;transition:all .15s;user-select:none}
.game-option:active{transform:scale(.95)}
.game-option.correct{background:#c8e6c9!important;border-color:#4caf50!important;color:#2e7d32!important;animation:pop .3s}
.game-option.wrong{background:#ffcdd2!important;border-color:#ef5350!important;color:#c62828!important;animation:shakeX .3s}
@keyframes shakeX{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.game-hud-bar{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.9);border-radius:14px;padding:8px 14px;margin-bottom:8px;font-size:14px;font-weight:700}
.game-hud-item{display:flex;align-items:center;gap:4px}
.game-start{background:linear-gradient(135deg,#66bb6a,#43a047);border-radius:20px;padding:30px;text-align:center;color:#fff}
.game-start h2{font-size:24px;margin:0 0 8px}
.game-start p{font-size:14px;opacity:.9;margin:0 0 20px}
.game-btn{background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.5);border-radius:16px;padding:14px 24px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;transition:all .2s;display:inline-block}
.game-btn:active{transform:scale(.95)}
.game-over{background:rgba(0,0,0,.7);border-radius:20px;padding:30px;text-align:center;color:#fff}
.game-over h2{font-size:28px;margin:0 0 10px}
.game-win{background:linear-gradient(135deg,#ffc107,#ff9800);border-radius:20px;padding:30px;text-align:center;color:#fff}
.game-win h2{font-size:24px;margin:0 0 8px}
</style>

      delay:1000,
      sessionDuration:30*60*1000,
      isOversea:false,

    });

function speak(text,audioKey){
  if(!text)return;
  // 1. 如果传了 audioKey，直接用本地音频
  if(audioKey && keyAudioMap[audioKey]){ playLocalAudio(keyAudioMap[audioKey],text); return; }
  // 2. 查本地音频映射
  const localFile = audioMap[text] || findLocalAudio(text);
  if(localFile){
    playLocalAudio(localFile,text);
    return;
  }
  // 3. 本地没有，用浏览器内置语音
  if(window.speechSynthesis && window.SpeechSynthesisUtterance){
    if(useSpeechSynthesis(text,'zh-CN'))return;
  }
  // 4. 最后用 Google TTS
  const url='https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q='+encodeURIComponent(text.slice(0,180));
  playTTS(url);
}

function speakEn(text,audioKey){
  if(!text)return;
  // 如果传了 audioKey，直接用本地音频
  if(audioKey && keyAudioMap[audioKey]){ playLocalAudio(keyAudioMap[audioKey],text); return; }
  // 查本地英文音频
  const localFile = findLocalAudioEn(text);
  if(localFile){
    playLocalAudio(localFile,text);
    return;
  }
  if(window.speechSynthesis && window.SpeechSynthesisUtterance){
    if(useSpeechSynthesis(text,'en-US'))return;
  }
  const url='https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q='+encodeURIComponent(text.slice(0,180));
  playTTS(url);
}

// 播放本地音频文件
function playLocalAudio(filename,text){
  const old=document.getElementById('ttsAudio');
  if(old){old.pause();old.remove();}
  if(window.speechSynthesis){try{speechSynthesis.cancel();}catch(e){}}
  
  const a=document.createElement('audio');
  a.id='ttsAudio';a.preload='auto';a.style.display='none';
  a.src='audio/'+filename;
  
  let played=false;
  let timeout=setTimeout(()=>{
    if(!played){
      speaking=false;a.remove();
      // 降级：用浏览器语音合成
      if(text && window.speechSynthesis && window.SpeechSynthesisUtterance){
        useSpeechSynthesis(text,'zh-CN');
      }
    }
  },5000);
  
  a.oncanplaythrough=()=>{if(played)return;played=true;clearTimeout(timeout);speaking=true;a.play().catch(()=>{});};
  a.onloadeddata=()=>{if(played)return;played=true;clearTimeout(timeout);speaking=true;a.play().catch(()=>{});};
  a.onended=()=>{speaking=false;clearTimeout(timeout);a.remove();};
  a.onerror=()=>{
    clearTimeout(timeout);speaking=false;a.remove();
    // 降级：MP3 不存在时用浏览器语音合成
    if(text && window.speechSynthesis && window.SpeechSynthesisUtterance){
      useSpeechSynthesis(text,'zh-CN');
    }
  };
  
  document.body.appendChild(a);
  a.load();
}

// 根据文本模糊匹配本地音频
function findLocalAudio(text){
  for(let key in audioMap){
    if(text===key || text.indexOf(key)>=0 || key.indexOf(text)>=0){
      return audioMap[key];
    }
  }
  // 数字
  const numMatch=text.match(/^(\d+)$/);
  if(numMatch && numMatch[1]<=20){
    return 'number_'+numMatch[1]+'.mp3';
  }
  return null;
}

function findLocalAudioEn(text){
  const enMap={'apple':'en_0.mp3','banana':'en_1.mp3','orange':'en_2.mp3','grape':'en_3.mp3',
    'watermelon':'en_4.mp3','strawberry':'en_5.mp3','peach':'en_6.mp3'};
  const lower=text.toLowerCase().trim();
  if(enMap[lower])return enMap[lower];
  // 字母
  const letterMap={'a for apple':'letter_0.mp3','b for ball':'letter_1.mp3','c for cat':'letter_2.mp3',
    'd for dog':'letter_3.mp3','e for egg':'letter_4.mp3','f for fish':'letter_5.mp3',
    'g for grapes':'letter_6.mp3','h for hat':'letter_7.mp3','i for ice cream':'letter_8.mp3',
    'j for juice':'letter_9.mp3','k for kite':'letter_10.mp3','l for lion':'letter_11.mp3',
    'm for moon':'letter_12.mp3','n for nest':'letter_13.mp3','o for orange':'letter_14.mp3',
    'p for panda':'letter_15.mp3','q for queen':'letter_16.mp3','r for rabbit':'letter_17.mp3',
    's for sun':'letter_18.mp3','t for tiger':'letter_19.mp3','u for umbrella':'letter_20.mp3',
    'v for violin':'letter_21.mp3','w for whale':'letter_22.mp3','x for xylophone':'letter_23.mp3',

function playTTS(url){
  const old=document.getElementById('ttsAudio');
  if(old){old.pause();old.remove();}
  if(window.speechSynthesis){try{speechSynthesis.cancel();}catch(e){}}
  speaking=false;
  
  const a=document.createElement('audio');
  a.id='ttsAudio';a.preload='auto';a.style.display='none';
  
  let played=false;
  let timeout=setTimeout(()=>{if(!played){speaking=false;a.remove();}},8000);
  
  a.oncanplaythrough=()=>{if(played)return;played=true;clearTimeout(timeout);speaking=true;a.play().catch(()=>{});};
  a.onloadeddata=()=>{if(played)return;played=true;clearTimeout(timeout);speaking=true;a.play().catch(()=>{});};
  a.onended=()=>{speaking=false;clearTimeout(timeout);a.remove();};
  a.onerror=()=>{clearTimeout(timeout);if(!played){speaking=false;}a.remove();};
  
  a.src=url;
  document.body.appendChild(a);
  a.load();
}

// 浏览器内置语音合成（备选方案）
let voicesReady=false;
function initSpeechSynthesis(){
  if(!window.speechSynthesis)return;
  try{
    if(speechSynthesis.getVoices&&speechSynthesis.getVoices().length>0){voicesReady=true;}
    if(speechSynthesis.onvoiceschanged!==undefined){speechSynthesis.onvoiceschanged=()=>{voicesReady=true;};}
  }catch(e){}
}

function useSpeechSynthesis(text,lang){
  if(!window.speechSynthesis||!window.SpeechSynthesisUtterance||!text){return false;}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang||'zh-CN';
    u.rate=0.85;u.pitch=1.1;u.volume=1;
    const voices=speechSynthesis.getVoices();
    if(voices&&voices.length>0){
      const zhVoice=voices.find(v=>v.lang&&v.lang.startsWith('zh'));
      if(zhVoice)u.voice=zhVoice;
    }
    u.onstart=()=>{speaking=true;};
    u.onend=()=>{speaking=false;};
    u.onerror=()=>{speaking=false;};
    speechSynthesis.speak(u);
    setTimeout(()=>{try{if(speaking)speechSynthesis.resume();}catch(e){}},100);
    return true;
  }catch(e){return false;}
}

try{initSpeechSynthesis();}catch(e){}

        ctx.strokeStyle='#bbb';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';
        patterns[curPattern].draw();
      }
      drawOutline();
      
      function getPos(e){
        const r=cvs.getBoundingClientRect();
        const sx=cvs.width/r.width,sy=cvs.height/r.height;
        const touch = e.touches && e.touches.length ? e.touches[0] : (e.changedTouches && e.changedTouches.length ? e.changedTouches[0] : null);
        const clientX = touch ? touch.clientX : e.clientX;
        const clientY = touch ? touch.clientY : e.clientY;
        return{x:(clientX-r.left)*sx,y:(clientY-r.top)*sy};
      }
      
      function startDraw(e){e.preventDefault();drawing=true;const p=getPos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);}
      function moveDraw(e){e.preventDefault();if(!drawing)return;const p=getPos(e);ctx.strokeStyle=curColor;ctx.lineWidth=12;ctx.lineCap='round';ctx.lineJoin='round';ctx.globalAlpha=0.5;ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.moveTo(p.x,p.y);}
      function endDraw(e){e.preventDefault();drawing=false;ctx.globalAlpha=1;}
      
      cvs.addEventListener('touchstart',startDraw,{passive:false});
      cvs.addEventListener('touchmove',moveDraw,{passive:false});
      cvs.addEventListener('touchend',endDraw,{passive:false});
      cvs.addEventListener('touchcancel',endDraw,{passive:false});
      cvs.addEventListener('mousedown',startDraw);
      cvs.addEventListener('mousemove',moveDraw);
      cvs.addEventListener('mouseup',endDraw);

      cvs.addEventListener('mousemove',moveDraw);

          d.style.border='3px solid #333';
          setTimeout(()=>{d.style.border='2px solid #fff';},200);
        });
      });
      
      // 图案切换
      document.querySelectorAll('#patternSwitcher .tab').forEach(btn=>{
        btn.addEventListener('click',()=>{
          curPattern=parseInt(btn.dataset.p);
          document.querySelectorAll('#patternSwitcher .tab').forEach(t=>t.classList.remove('active'));
          btn.classList.add('active');
          drawOutline();
        });
      });
      
      document.getElementById('clearColor').addEventListener('click',drawOutline);

        if(done){showToast('已完成');overlay.remove();return;}
        state.learned[key]=true;saveState();addStars(2);showToast(`+2⭐ 完成涂色画`);overlay.remove();renderContent();
      });
    },100);
  }
}

function startGame(){
  gameLock=false;
  gameState={
    phase:'playing',killed:0,missed:0,maxMiss:3,targetKill:5,
    currentQ:null,usedQ:[],zombiePos:0,zombieSteps:5,
    zombies:[{emoji:'🧟',name:'普通僵尸'},{emoji:'🧟‍♂️',name:'路障僵尸'},{emoji:'💀',name:'铁桶僵尸'},{emoji:'👻',name:'小鬼僵尸'},{emoji:'🧌',name:'大僵尸'}]
  };
  renderContent();
  nextQuestion();
}

function nextQuestion(){
  const gs=gameState;
  if(gs.phase!=='playing')return;
  gameLock=false;
  // 选一个没用过的题
  const available=gameQuestions.filter((_,i)=>!gs.usedQ.includes(i));
  if(available.length===0){gs.usedQ=[];return nextQuestion();}
  const idx=Math.floor(Math.random()*available.length);
  const origIdx=gameQuestions.indexOf(available[idx]);
  gs.usedQ.push(origIdx);
  gs.currentQ=available[idx];
  gs.zombiePos=0;
  updateGameUI();
}

function answerQuestion(idx){
  if(!gameState||gameState.phase!=='playing')return;
  if(gameLock)return;
  gameLock=true;
  const gs=gameState;
  const q=gs.currentQ;
  if(!q)return;

  const opts=document.querySelectorAll('.game-option');
  if(idx===q.ans){
    // 答对了！
    opts[idx].classList.add('correct');
    const plantEl=document.getElementById('gamePlant');
    if(plantEl){plantEl.classList.add('shoot');setTimeout(()=>plantEl.classList.remove('shoot'),300);}
    const zombieEl=document.getElementById('gameZombie');
    if(zombieEl){zombieEl.classList.add('hit');setTimeout(()=>zombieEl.classList.add('defeat'),300);}
    gs.killed++;
    addStars(1);
    showToast('✅ 答对了！+'+(q.cat==='数学'?'🧮':q.cat==='语文'?'📖':q.cat==='英语'?'🔤':'🌍')+' +1⭐');
    if(navigator.vibrate)navigator.vibrate([30,50,30]);
    setTimeout(()=>{
      if(gs.killed>=gs.targetKill){
        gs.phase='win';
        addStars(5);
        renderContent();
      }else{
        nextQuestion();
      }
    },800);
  }else{
    // 答错了
    opts[idx].classList.add('wrong');
    opts[q.ans].classList.add('correct');
    gs.missed++;
    gs.zombiePos++;
    const zombieEl=document.getElementById('gameZombie');
    if(zombieEl)zombieEl.style.left=(gs.zombiePos/gs.zombieSteps*100)+'%';
    showToast('❌ 再想想！僵尸前进了！');
    if(navigator.vibrate)navigator.vibrate([100,50,100]);
    setTimeout(()=>{
      if(gs.missed>=gs.maxMiss){
        gs.phase='lose';
        renderContent();
      }else if(gs.zombiePos>=gs.zombieSteps){
        gs.phase='lose';
        renderContent();
      }else{
        gameLock=false;
        updateGameUI();
      }
    },800);
  }
}

function updateGameUI(){
  const gs=gameState;
  if(!gs||gs.phase!=='playing')return;
  const q=gs.currentQ;
  if(!q)return;

  const scene=document.getElementById('gameScene');
  if(!scene)return;

  // 更新HUD
  const hud=document.getElementById('gameHud');
  if(hud)hud.innerHTML=`
    <span class="game-hud-item">🌻 植物</span>
    <span class="game-hud-item">⚡ 击败：${gs.killed}/${gs.targetKill}</span>
    <span class="game-hud-item">❌ 失误：${gs.missed}/${gs.maxMiss}</span>
    <span class="game-hud-item">${q.cat==='数学'?'🧮':q.cat==='语文'?'📖':q.cat==='英语'?'🔤':'🌍'} ${q.cat}</span>
  `;

  // 更新草坪
  const lawn=document.getElementById('gameLawn');
  if(lawn){
    const zombieEmoji=gs.zombies[Math.min(gs.killed,gs.zombies.length-1)].emoji;
    lawn.innerHTML=`
      <div class="game-path">
        <div class="game-plant-def" id="gamePlant">🥔</div>
        <div class="game-zombie-move" id="gameZombie" style="left:${gs.zombiePos/gs.zombieSteps*100}%">${zombieEmoji}</div>
        <div style="position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:24px;opacity:.6">🏁</div>
      </div>
    `;
  }

  // 更新题目
  const qBox=document.getElementById('gameQBox');
  if(qBox){
    const shuffled=[...q.opts];
    qBox.innerHTML=`
      <div class="game-question">
        <span class="q-emoji">${q.e}</span>
        <span class="q-text">${q.q}</span>
      </div>
      <div class="game-options">
        ${shuffled.map((o,i)=>`<div class="game-option" onclick="answerQuestion(${i})">${o}</div>`).join('')}
      </div>
    `;
  }
}

    const isDone=!!state.checkinToday[mi.id];
    const el=document.createElement('div');el.className='check-row';
    el.innerHTML=`<div class="check-ic">${mi.icon}</div><div class="check-info"><div class="check-name">${mi.name}（${mi.tag}）</div><div class="check-prog">${d}/${total} ${isDone?'✅今日已打卡':'+2★'}</div></div><span class="check-status ${isDone?'done':''}">${isDone?'已完成':'未完成'}</span><button class="check-btn ${isDone?'done':''}">${isDone?'取消':'打卡'}</button>`;
    el.querySelector('button').addEventListener('click',()=>{
      if(isDone){
        resetModule(mi.id);
      }else{
        finishModule(mi.id);
      }
    });
    list.appendChild(el);
  });
  // 日历
  const calGrid=document.getElementById('calGrid');
  const days=['日','一','二','三','四','五','六'];
  calGrid.innerHTML=days.map(d=>`<div class="cal-day hd">${d}</div>`).join('');
  // 填充前面空白
  for(let i=0;i<firstDay;i++){
    calGrid.insertAdjacentHTML('beforeend','<div class="cal-day" style="visibility:hidden">0</div>');
  }
  for(let i=1;i<=daysInMonth;i++){
    const dateStr=year+'-'+String(month+1).padStart(2,'0')+'-'+String(i).padStart(2,'0');
    const checked=!!state.calendar[dateStr];
    const isToday=(i===todayDate&&month===todayMonth&&year===todayYear);
    calGrid.insertAdjacentHTML('beforeend',`<div class="cal-day ${checked?'checked':''} ${isToday?'today':''}">${i}</div>`);
  }
  // 绑定月份切换
  document.getElementById('calPrev').addEventListener('click',()=>{
    state.curCalMonth--;
    if(state.curCalMonth<0){state.curCalMonth=11;state.curCalYear--;}
    renderContent();
  });
  document.getElementById('calNext').addEventListener('click',()=>{
    state.curCalMonth++;
    if(state.curCalMonth>11){state.curCalMonth=0;state.curCalYear++;}
    renderContent();
  });
}

// 奖励兑换
function renderShop(ct,m){
  ct.insertAdjacentHTML('beforeend','<div class="card"><div class="card-hd"><span class="card-icon">⭐</span><span class="card-title">当前余额：'+state.stars+'颗星星</span></div></div><div id="shopList"></div>');
  const list=document.getElementById('shopList');
  rewards.forEach(r=>{
    const can=state.stars>=r.p;
    const el=document.createElement('div');el.className='shop-item';
    el.innerHTML=`<div class="shop-name"><span class="shop-ic">${r.e||'🎁'}</span><span>${r.n}</span></div><div class="shop-price">${r.p}★</div><button class="shop-btn" ${can?'':'disabled'}>${can?'兑换':'星星不足'}</button>`;
    el.querySelector('button').addEventListener('click',()=>{
      if(!can)return;
      state.stars-=r.p;saveState();showToast(`🎉 兑换成功：${r.n}`);renderContent();
    });
    list.appendChild(el);
  });
}

// 学习统计

  ct.insertAdjacentHTML('beforeend',`

      <div class="stat-card"><div class="stat-num" id="stStars">${state.stars}</div><div class="stat-label">总星星数</div></div>
      <div class="stat-card"><div class="stat-num" id="stLearn">${totalLearned}</div><div class="stat-label">已学项目</div></div>

    <div class="card"><div class="card-hd"><span class="card-icon">💾</span><span class="card-title">数据备份与同步</span></div>

      <div style="font-size:12px;color:#888;text-align:center;padding:0 10px 6px">换手机/平板时用导出/导入备份，或设置下方Token后点击顶部 📱 云同步</div>
      <div style="border-top:1px solid #e3f2fd;margin:8px 0;padding-top:10px">
        <div style="font-size:13px;font-weight:700;color:#333;margin-bottom:6px">☁️ 多手机云同步设置</div>
        <div style="font-size:11px;color:#888;margin-bottom:8px;line-height:1.5">输入GitHub Token开启云同步。每台手机只需输入一次，之后点击顶部📱按钮即可同步。Token生成：<a href="https://github.com/settings/tokens/new?scopes=repo&description=workbench-sync" target="_blank" style="color:#29b6f6">点这里</a>，勾选repo权限</div>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="syncTokenInput" type="password" placeholder="ghp_..." style="flex:1;border:1px solid #e0e0e0;border-radius:8px;padding:8px 10px;font-size:13px" value="${getSyncToken()}" />
          <button class="tab" style="background:#29b6f6;color:#fff;border:none;padding:8px 14px" onclick="saveSyncToken()">保存</button>

        <div id="syncStatus" style="font-size:11px;margin-top:6px;text-align:center">${hasSyncToken()?'<span style="color:#4caf50">✅ 已设置Token，可点击顶部📱同步</span>':'<span style="color:#999">未设置Token</span>'}</div>

// ============ 工具函数 ============
function getModuleDone(mid){
  let count=0;
  Object.keys(state.learned).forEach(k=>{
    if(k.startsWith(mid)||(mid==='renwu'&&k.startsWith('renwu_'))||(mid==='yuyan'&&k.startsWith('yuyan_'))||(mid==='shuli'&&k.startsWith('shuli_'))||(mid==='yingyu'&&k.startsWith('yingyu_'))||(mid==='zimu'&&k.startsWith('zimu_'))||(mid==='shuzi'&&k.startsWith('num_'))||(mid==='yinyue'&&k.startsWith('yinyue_'))||(mid==='meishu'&&k.startsWith('meishu_'))||(mid==='shenghuo'&&(k.startsWith('life_')||k.startsWith('zili_')||k.startsWith('sport_')||k.startsWith('emo_'))))count++;
  });
  return Math.max(count,state.moduleDone[mid]||0);
}
function finishItem(prefix,idx,stars){
  const key=prefix+'_'+idx;if(state.learned[key])return;
  state.learned[key]=true;saveState();addStars(stars);showToast(`+${stars}⭐ 完成学习`);
  renderContent();
}
function finishModule(mid){
  const today=new Date().toDateString();
  // 初始化今日打卡记录
  if(!state.checkinToday||state.checkinToday._date!==today){
    state.checkinToday={_date:today};
  }
  // 每天只增加一次 totalDays 和 streak
  if(state.lastDate!==today){
    state.lastDate=today;
    const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
    if(state.lastCheck!==yesterday.toDateString())state.streak=0;
    state.streak++;state.totalDays++;
  }
  state.moduleDone[mid]=(state.moduleDone[mid]||0)+1;
  state.checkinToday[mid]=true;
  const now=new Date();
  const dk=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  state.calendar[dk]=true;state.lastCheck=today;
  saveState();addStars(2);showToast('✅ 打卡成功 +2⭐');
  renderContent();
}
function resetModule(mid){
  // 撤销该模块的今日打卡
  const today=new Date().toDateString();
  if(!state.checkinToday||state.checkinToday._date!==today){
    state.checkinToday={_date:today};
  }
  delete state.checkinToday[mid];
  if(state.moduleDone[mid])state.moduleDone[mid]--;
  state.stars=Math.max(0,state.stars-2);
  // 检查今天是否还有其他模块打卡
  const anyTodayDone=menuItems.slice(0,9).some(x=>state.checkinToday[x.id]);
  if(!anyTodayDone){
    const now=new Date();
    const dk=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    delete state.calendar[dk];
    const calDays=Object.keys(state.calendar||{}).filter(k=>state.calendar[k]).length;
    state.totalDays=calDays;
    if(state.streak>calDays)state.streak=calDays;
    state.lastDate='';state.lastCheck='';
  }
  saveState();updateTop();
  showToast('已取消打卡，-2⭐');
  renderContent();
}
function addStars(n){
  state.stars+=n;saveState();updateTop();
}
function updateTop(){
  document.getElementById('topStars').textContent=state.stars;
  document.getElementById('topDays').textContent=state.totalDays;
}
function goHome(){state.curMenu='renwu';renderMenu();renderContent();}
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

// ============ 初始化 ============
function init(){
  try{
    if(!state.curMenu)state.curMenu='renwu';
    // 每日归零：清除昨天的 learned 学习记录（保留星星/打卡/日历等永久数据）
    const today=new Date().toDateString();
    if(state.lastLearnedReset!==today){
      state.learned={};
      state.lastLearnedReset=today;
      saveState();
    }
    // 校正 totalDays：用日历实际打卡天数
    const calDays=Object.keys(state.calendar||{}).filter(k=>state.calendar[k]).length;
    if(calDays>0&&calDays!==state.totalDays){
      state.totalDays=calDays;
      if(state.streak>calDays)state.streak=calDays;
      saveState();
    }
    renderMenu();renderContent();
    // 启动时从云端拉取数据
    setTimeout(syncDownload, 1500);
  }catch(e){console.error('init error:',e);}
}
init();

// ============ 多设备同步（通过 /api/sync 代理调用 GitHub API） ============
let syncUploadTimer=null;
let syncFailCount=0;

function getSyncToken(){
  return localStorage.getItem('gh_sync_token')||'';
}
function setSyncToken(t){
  if(t) localStorage.setItem('gh_sync_token',t);
  else localStorage.removeItem('gh_sync_token');
}
function hasSyncToken(){
  return !!getSyncToken();
}

function getDeviceId(){
  let id=localStorage.getItem('xiaoningmeng_device_id');
  if(!id){
    id='dev_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
    localStorage.setItem('xiaoningmeng_device_id',id);
  }
  return id;
}
const DEVICE_ID=getDeviceId();

function deepMergeObjects(a,b){
  const res={};
  const keys=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);
  keys.forEach(k=>{res[k]=(a&&a[k])||(b&&b[k])||true;});
  return res;
}

function mergeState(local, cloud){
  if(!cloud||cloud.stars===undefined)return local;
  const merged={...local};
  merged.stars=Math.max(local.stars||0, cloud.stars||0);
  merged.totalDays=Math.max(local.totalDays||0, cloud.totalDays||0);
  merged.streak=Math.max(local.streak||0, cloud.streak||0);
  merged.learned=deepMergeObjects(local.learned, cloud.learned);
  merged.checks=deepMergeObjects(local.checks, cloud.checks);
  merged.calendar=deepMergeObjects(local.calendar, cloud.calendar);
  merged.moduleDone=deepMergeObjects(local.moduleDone, cloud.moduleDone);
  merged.checkinToday=deepMergeObjects(local.checkinToday, cloud.checkinToday);
  if(cloud._syncTime)merged._syncTime=Math.max(local._syncTime||0, cloud._syncTime);
  return merged;
}

// 通过 /api/sync 代理：下载云端数据
async function syncDownload(){
  const token=getSyncToken();
  if(!token){console.log('sync: no token');return false;}
  try{
    const resp=await fetch('/api/sync?token='+encodeURIComponent(token),{
      method:'GET',
      headers:{'Content-Type':'application/json'}
    });
    const r=await resp.json();
    if(r.ok && r.data){
      const merged=mergeState(state, r.data);
      state=merged;
      saveState();renderContent();updateTop();
      syncFailCount=0;updateSyncBadge();
      return true;
    }
    // 云端无数据，正常
    syncFailCount=0;updateSyncBadge();
    return true;
  }catch(e){console.log('sync download fail',e);}
  syncFailCount++;updateSyncBadge();
  return false;
}

// 通过 /api/sync 代理：上传同步数据
async function syncUpload(){
  const token=getSyncToken();
  if(!token){console.log('sync: no token');return {ok:false,msg:'no token'};}
  try{
    state._syncTime=Date.now();
    state._device=DEVICE_ID;
    const resp=await fetch('/api/sync',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:token, data:state})
    });
    const r=await resp.json();
    if(r.ok){
      syncFailCount=0;updateSyncBadge();
      return {ok:true};
    }
    console.log('sync upload fail', r.msg);
    syncFailCount++;updateSyncBadge();
    return {ok:false, msg:r.msg||'upload failed'};
  }catch(e){
    console.log('sync upload fail',e);
    syncFailCount++;updateSyncBadge();
    return {ok:false, msg:e.message};
  }
}

async function syncAll(){
  if(!hasSyncToken()){
    showToast('请先在「学习统计」页面设置同步Token');
    return;
  }
  showToast('☁️ 正在同步...');
  const down=await syncDownload();
  if(!down){showToast('❌ 下载失败，请检查网络');return;}
  const up=await syncUpload();
  if(up.ok){
    showToast('✅ 同步完成');
  }else{
    let msg='⚠️ 上传失败';
    if(up.msg)msg+='：'+up.msg;
    showToast(msg);
  }
}

function scheduleSyncUpload(){
  if(syncUploadTimer)clearTimeout(syncUploadTimer);
  syncUploadTimer=setTimeout(()=>{
    syncUpload().catch(()=>{});
  }, 3000);
}

function updateSyncBadge(){
  const badge=document.getElementById('syncBadge');
  if(badge)badge.style.display=syncFailCount>=3?'inline-block':'none';
  const btn=document.getElementById('syncBtn');
  if(btn)btn.style.color=hasSyncToken()?'':'#ccc';
}

// ============ 导出/导入数据 ============
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='xiaoningmeng_backup_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('💾 数据已导出');
}

function importData(){
  const input=document.createElement('input');
  input.type='file';input.accept='.json,application/json';
  input.onchange=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const imported=JSON.parse(reader.result);
        if(imported.stars!==undefined){
          state=mergeState(state, imported);
          saveState();
          updateTop();renderContent();
          syncUpload();
          showToast('✅ 数据导入成功并已上传');
        }else showToast('❌ 文件格式不正确');
      }catch{showToast('❌ 文件解析失败');}
    };
    reader.readAsText(file);
  };
  input.click();
}

// 保存同步Token
function saveSyncToken(){
  const val=document.getElementById('syncTokenInput').value.trim();
  if(val){
    setSyncToken(val);
    showToast('✅ Token已保存，可点击顶部📱同步');
    // 立即尝试同步一次
    setTimeout(()=>syncAll(),500);
  }else{
    setSyncToken('');
    showToast('已清除Token');
  }
  updateSyncBadge();
  renderContent();
}

// ============ 注册 Service Worker (PWA) ============
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
